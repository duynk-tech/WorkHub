name: WorkHub Local Deploy

on:
  push:
    branches:
      - main

# Tránh việc chạy song song nhiều lượt build nếu push liên tục
concurrency:
  group: deploy-workhub
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy on Local Server
    runs-on: self-hosted
    env:
      PATH: /Users/duynguyen/.docker/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Update Code & Rebuild Docker
        run: |
          echo "🚀 [1/4] Bắt đầu triển khai trên máy: $(hostname)"
          cd /Users/Projects/work-hub

          echo "📥 [2/4] Đồng bộ mã nguồn mới nhất từ nhánh main..."
          git fetch origin main
          git reset --hard origin/main

          echo "🔨 [3/4] Build lại Docker image và cập nhật containers..."
          docker compose up -d --build

          echo "🔍 [4/4] Kiểm tra trạng thái containers..."
          sleep 5
          docker compose ps

          echo "✅ WorkHub đã được cập nhật và triển khai thành công!"
